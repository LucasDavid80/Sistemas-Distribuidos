services:
  db:
    ports:
      - "5434:5432"

  api:
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app_db
      - CORS_ORIGINS=http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173,http://127.0.0.1:5173

  frontend:
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://127.0.0.1:8002
      - VITE_USER_ID=1

