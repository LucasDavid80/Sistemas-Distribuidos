name: CI - Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose*.yml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches:
      - main
      - pratica-6
      - pratica-7
      - projeto-final
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose*.yml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"

jobs:
  lint-and-format:
    name: Biome (Lint e Formatação)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar lint
        run: npm run lint
      - name: Verificar formatação
        run: npm run format:check

  test:
    name: Vitest (Testes Unitários e Integração)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes Vitest
        run: npm run test

  build:
    name: Vite (Build de Produção)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Gerar build
        run: npm run build

  e2e:
    name: Playwright (Testes E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar testes E2E
        working-directory: .
        env:
          E2E_BASE_URL: http://127.0.0.1:5174
          VITE_API_URL: http://127.0.0.1:8002
          VITE_USER_ID: "1"
        run: make e2e
      - name: Enviar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
