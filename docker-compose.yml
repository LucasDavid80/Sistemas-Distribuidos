services:
  # Serviço do Banco de Dados Relacional (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: c216_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviço da Aplicação FastAPI (Backend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: c216_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app_db
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

# Definição de volumes persistentes
volumes:
  pgdata:
    driver: local

# Definição de rede interna compartilhada
networks:
  app_network:
    driver: bridge
